<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 员工门户</title>
    <link href="/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: #f5f7fa; min-height: 100vh;
        }
        .navbar { background: linear-gradient(135deg, #065f46, #047857); }
        .navbar-brand { color: #fff !important; font-weight: 700; }
        .navbar .nav-link { color: rgba(255,255,255,.85) !important; }
        .navbar .nav-link:hover { color: #fff !important; }
        .container-main { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .card { border: none; border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,.06); margin-bottom: 24px; }
        .card-header {
            background: #fff; border-bottom: 1px solid #f0f0f0;
            border-radius: 16px 16px 0 0 !important;
            padding: 18px 24px; font-weight: 700; font-size: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .card-header i { font-size: 20px; color: #10b981; }
        .card-body { padding: 24px; }
        .info-row { display: flex; margin-bottom: 16px; align-items: flex-start; }
        .info-label { width: 100px; color: #888; font-size: 14px; flex-shrink: 0; padding-top: 2px; }
        .info-value { flex: 1; font-size: 15px; color: #333; }
        .btn-primary {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none; border-radius: 10px; padding: 10px 24px;
            font-weight: 600; transition: all .3s;
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 15px rgba(16,185,129,.35); }
        .btn-outline-secondary { border-radius: 10px; }
        .form-control, .form-select {
            border-radius: 10px; padding: 10px 14px; border: 1px solid #e0e0e0;
            font-size: 14px;
        }
        .form-control:focus, .form-select:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.1); }
        .edit-section { display: none; }
        .edit-section.active { display: block; }
        .view-section.active { display: block; }
        .view-section { display: none; }
        .msg { display: none; margin-top: 10px; font-size: 14px; padding: 8px 16px; border-radius: 10px; }
        .msg.success { background: #d1fae5; color: #065f46; }
        .msg.error { background: #fee2e2; color: #991b1b; }
        .loading-text { text-align: center; padding: 40px; color: #999; }
        .badge-emp { background: #d1fae5; color: #065f46; border-radius: 20px; padding: 3px 12px; font-size: 12px; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="bi bi-person-circle"></i> 员工门户</a>
            <div class="ms-auto d-flex align-items-center gap-3">
                <span class="text-white" id="empNameDisplay" style="font-size:14px;"></span>
                <button class="btn btn-sm btn-outline-light" onclick="doLogout()">退出登录</button>
            </div>
        </div>
    </nav>

    <div class="container-main">
        <div class="loading-text" id="loading">加载中...</div>

        <!-- 查看模式 -->
        <div class="view-section" id="viewSection">
            <div class="card">
                <div class="card-header"><i class="bi bi-person-badge"></i> 基本信息</div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="info-row"><span class="info-label">姓名</span><span class="info-value" id="vName">-</span></div>
                            <div class="info-row"><span class="info-label">性别</span><span class="info-value" id="vGender">-</span></div>
                            <div class="info-row"><span class="info-label">年龄</span><span class="info-value" id="vAge">-</span></div>
                            <div class="info-row"><span class="info-label">部门</span><span class="info-value" id="vDept">-</span></div>
                        </div>
                        <div class="col-md-6">
                            <div class="info-row"><span class="info-label">手机号</span><span class="info-value" id="vPhone">-</span></div>
                            <div class="info-row"><span class="info-label">邮箱</span><span class="info-value" id="vEmail">-</span></div>
                            <div class="info-row"><span class="info-label">地址</span><span class="info-value" id="vAddress">-</span></div>
                            <div class="info-row"><span class="info-label">状态</span><span class="info-value"><span class="badge-emp" id="vStatus">-</span></span></div>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-primary" onclick="toggleEdit()"><i class="bi bi-pencil-square"></i> 编辑资料</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 编辑模式 -->
        <div class="edit-section" id="editSection">
            <div class="card">
                <div class="card-header"><i class="bi bi-pencil-square"></i> 编辑个人资料</div>
                <div class="card-body">
                    <form id="profileForm">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">姓名</label>
                                <input type="text" class="form-control" id="eName" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">性别</label>
                                <select class="form-select" id="eGender">
                                    <option value="男">男</option>
                                    <option value="女">女</option>
                                </select>
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">年龄</label>
                                <input type="number" class="form-control" id="eAge" min="18" max="65">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">手机号</label>
                                <input type="text" class="form-control" id="ePhone">
                            </div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">邮箱</label>
                                <input type="email" class="form-control" id="eEmail">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">地址</label>
                                <input type="text" class="form-control" id="eAddress">
                            </div>
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> 保存</button>
                            <button type="button" class="btn btn-outline-secondary" onclick="toggleEdit()">取消</button>
                        </div>
                        <div class="msg" id="profileMsg"></div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 修改密码 -->
        <div class="card">
            <div class="card-header"><i class="bi bi-lock"></i> 修改密码</div>
            <div class="card-body">
                <form id="passwordForm">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">旧密码</label>
                            <input type="password" class="form-control" id="oldPassword" placeholder="输入当前密码" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">新密码</label>
                            <input type="password" class="form-control" id="newPassword" placeholder="输入新密码" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">确认新密码</label>
                            <input type="password" class="form-control" id="confirmPassword" placeholder="再次输入新密码" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary"><i class="bi bi-shield-check"></i> 修改密码</button>
                    <div class="msg" id="pwdMsg"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="/vendor/jquery.min.js"></script>
    <script>
        var currentEmp = null;

        // 页面加载：检查登录状态
        $(function() {
            $.get('/api/emp-portal/current', function(res) {
                if (res.code === 200) {
                    currentEmp = res.data;
                    renderView();
                    $('#empNameDisplay').text(currentEmp.name);
                } else {
                    window.location.href = '/login';
                }
            }).fail(function() {
                window.location.href = '/login';
            });
        });

        function renderView() {
            $('#vName').text(currentEmp.name || '-');
            $('#vGender').text(currentEmp.gender || '-');
            $('#vAge').text(currentEmp.age || '-');
            $('#vPhone').text(currentEmp.phone || '-');
            $('#vEmail').text(currentEmp.email || '-');
            $('#vAddress').text(currentEmp.address || '-');
            $('#vStatus').text(currentEmp.status || '-');
            $('#vDept').text(currentEmp.deptName || currentEmp.deptId || '-');

            // 填充编辑表单
            $('#eName').val(currentEmp.name);
            $('#eGender').val(currentEmp.gender);
            $('#eAge').val(currentEmp.age);
            $('#ePhone').val(currentEmp.phone);
            $('#eEmail').val(currentEmp.email);
            $('#eAddress').val(currentEmp.address);

            $('#loading').hide();
            $('#viewSection').addClass('active');
        }

        function toggleEdit() {
            var view = $('#viewSection'), edit = $('#editSection');
            if (edit.hasClass('active')) {
                edit.removeClass('active');
                view.addClass('active');
            } else {
                view.removeClass('active');
                edit.addClass('active');
            }
        }

        // 保存个人资料
        $('#profileForm').on('submit', function(e) {
            e.preventDefault();
            var data = {
                name: $('#eName').val().trim(),
                gender: $('#eGender').val(),
                age: parseInt($('#eAge').val()) || 25,
                phone: $('#ePhone').val().trim(),
                email: $('#eEmail').val().trim(),
                address: $('#eAddress').val().trim()
            };

            $.ajax({
                url: '/api/emp-portal/profile',
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    if (res.code === 200) {
                        showMsg('profileMsg', res.message, 'success');
                        // 刷新显示
                        $.get('/api/emp-portal/current', function(r) {
                            if (r.code === 200) { currentEmp = r.data; renderView(); }
                        });
                        toggleEdit();
                    } else {
                        showMsg('profileMsg', res.message, 'error');
                    }
                },
                error: function() {
                    showMsg('profileMsg', '网络错误', 'error');
                }
            });
        });

        // 修改密码
        $('#passwordForm').on('submit', function(e) {
            e.preventDefault();
            var oldPwd = $('#oldPassword').val();
            var newPwd = $('#newPassword').val();
            var confirmPwd = $('#confirmPassword').val();

            if (!oldPwd || !newPwd || !confirmPwd) {
                showMsg('pwdMsg', '请填写完整的密码信息', 'error'); return;
            }
            if (newPwd !== confirmPwd) {
                showMsg('pwdMsg', '两次输入的新密码不一致', 'error'); return;
            }

            $.ajax({
                url: '/api/emp-portal/password',
                type: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({ oldPassword: oldPwd, newPassword: newPwd }),
                success: function(res) {
                    if (res.code === 200) {
                        showMsg('pwdMsg', res.message, 'success');
                        $('#passwordForm')[0].reset();
                    } else {
                        showMsg('pwdMsg', res.message, 'error');
                    }
                },
                error: function() {
                    showMsg('pwdMsg', '网络错误', 'error');
                }
            });
        });

        function doLogout() {
            $.post('/api/logout', function() {
                window.location.href = '/login';
            });
        }

        function showMsg(id, text, type) {
            var $msg = $('#' + id);
            $msg.removeClass('success error').addClass(type).text(text).show();
            setTimeout(function() { $msg.fadeOut(); }, 3000);
        }
    </script>
</body>
</html>
