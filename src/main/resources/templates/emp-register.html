<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>员工注册 - 企业管理系统 Pro</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 50%, #d1fae5 100%);
        }
        .register-wrapper {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 40px 20px;
        }
        .register-card {
            background: #fff; border-radius: 20px;
            padding: 40px; width: 520px;
            box-shadow: 0 10px 40px rgba(0,0,0,.1);
        }
        .register-card h2 {
            text-align: center; margin-bottom: 8px; font-weight: 700;
            color: #065f46;
        }
        .register-card .subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 14px; }
        .form-control, .form-select {
            border-radius: 10px; padding: 10px 14px; border: 1px solid #e0e0e0;
            font-size: 14px; transition: all .3s;
        }
        .form-control:focus, .form-select:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,.15); }
        .btn-register {
            width: 100%; padding: 12px; border-radius: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            border: none; font-size: 16px; font-weight: 600;
            color: #fff; transition: all .3s; margin-top: 10px;
        }
        .btn-register:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(16,185,129,.4); }
        .msg { text-align: center; margin-top: 12px; font-size: 14px; display: none; }
        .msg.error { color: #e74c3c; }
        .msg.success { color: #10b981; }
        .links { text-align: center; margin-top: 18px; font-size: 14px; }
        .links a { color: #10b981; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="register-wrapper">
        <div class="register-card">
            <h2>📝 员工注册</h2>
            <p class="subtitle">创建您的员工门户账号</p>
            <form id="registerForm">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">用户名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="username" placeholder="登录用户名" required autocomplete="off">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">密码 <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="password" placeholder="登录密码" required>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">姓名 <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" placeholder="真实姓名" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">性别</label>
                        <select class="form-select" id="gender">
                            <option value="男">男</option>
                            <option value="女">女</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">年龄</label>
                        <input type="number" class="form-control" id="age" placeholder="年龄" min="18" max="65" value="25">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">所属部门</label>
                        <select class="form-select" id="deptId">
                            <option value="">请选择部门</option>
                        </select>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">手机号</label>
                        <input type="text" class="form-control" id="phone" placeholder="手机号码">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">邮箱</label>
                        <input type="email" class="form-control" id="email" placeholder="电子邮箱">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">地址</label>
                    <input type="text" class="form-control" id="address" placeholder="常住地址">
                </div>
                <button type="submit" class="btn btn-register">注 册</button>
                <div class="msg" id="msg"></div>
            </form>
            <div class="links">
                已有账号？<a href="/login">返回登录</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script>
        // 加载部门列表
        $(function() {
            $.get('/api/department', function(res) {
                if (res.code === 200 && res.data) {
                    res.data.forEach(function(dept) {
                        $('#deptId').append('<option value="' + dept.id + '">' + dept.name + '</option>');
                    });
                }
            });
        });

        $('#registerForm').on('submit', function(e) {
            e.preventDefault();
            var username = $('#username').val().trim();
            var password = $('#password').val();
            var name = $('#name').val().trim();

            if (!username) { showMsg('请输入用户名', 'error'); return; }
            if (!password) { showMsg('请输入密码', 'error'); return; }
            if (!name)    { showMsg('请输入姓名', 'error'); return; }

            var data = {
                username: username,
                password: password,
                name: name,
                gender: $('#gender').val(),
                age: parseInt($('#age').val()) || 25,
                deptId: $('#deptId').val() ? parseInt($('#deptId').val()) : null,
                phone: $('#phone').val().trim(),
                email: $('#email').val().trim(),
                address: $('#address').val().trim()
            };

            $.ajax({
                url: '/api/emp-portal/register',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(data),
                success: function(res) {
                    if (res.code === 200) {
                        showMsg('注册成功！即将跳转登录页...', 'success');
                        setTimeout(function() { window.location.href = '/login'; }, 1500);
                    } else {
                        showMsg(res.message, 'error');
                    }
                },
                error: function() {
                    showMsg('网络错误，请重试', 'error');
                }
            });
        });

        function showMsg(text, type) {
            var $msg = $('#msg');
            $msg.text(text).removeClass('error success').addClass(type).show();
        }
    </script>
</body>
</html>
