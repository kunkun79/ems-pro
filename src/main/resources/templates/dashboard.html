<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仪表盘 - 企业管理系统 Pro</title>
    <link href="/vendor/bootstrap.min.css" rel="stylesheet">
    <link href="/vendor/bootstrap-icons.min.css" rel="stylesheet">
    <script src="/vendor/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #f0f2f5; display: flex; min-height: 100vh; }
        .sidebar {
            width: 240px; min-height: 100vh;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            color: #fff; flex-shrink: 0; padding-top: 20px;
        }
        .sidebar .logo { padding: 0 20px 20px; font-size: 18px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,.1); }
        .sidebar a {
            display: flex; align-items: center; gap: 12px; padding: 14px 20px;
            color: rgba(255,255,255,.7); text-decoration: none; font-size: 15px;
            border-left: 3px solid transparent; transition: all .2s;
        }
        .sidebar a:hover, .sidebar a.active { color: #fff; background: rgba(255,255,255,.08); border-left-color: #4361ee; }
        .main { flex: 1; padding: 24px; overflow-y: auto; }
        .top-bar { background: #fff; border-radius: 12px; padding: 16px 24px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 24px; }
        .stat-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06); display: flex; align-items: center; gap: 16px; }
        .stat-icon { width: 56px; height: 56px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; }
        .stat-val { font-size: 28px; font-weight: 700; }
        .stat-label { font-size: 14px; color: #888; }
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .chart-box { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .chart-box h5 { margin-bottom: 16px; font-weight: 600; }
        .chart-inner { width: 100%; height: 300px; }
        @media (max-width: 768px) { .stats, .charts-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="sidebar">
        <div class="logo">🚀 企业管理系统 Pro</div>
        <a href="/dashboard" class="active"><i class="bi bi-speedometer2"></i> 仪表盘</a>
        <a href="/employee"><i class="bi bi-people"></i> 员工管理</a>
        <a href="/department"><i class="bi bi-diagram-3"></i> 部门管理</a>
        <a href="/efficiency"><i class="bi bi-graph-up-arrow"></i> 效能可视化</a>
        <a href="/bigdata"><i class="bi bi-bar-chart"></i> 大数据分析</a>
        <a href="/bigdata-screen"><i class="bi bi-tv"></i> 数据大屏</a>
        <a href="/admin"><i class="bi bi-person-gear"></i> 个人中心</a>
    </nav>
    <div class="main">
        <div class="top-bar">
            <h5 class="mb-0">📊 系统仪表盘</h5>
            <div><span id="userName"></span> <button class="btn btn-outline-secondary btn-sm ms-2" onclick="logout()">退出</button></div>
        </div>
        <!-- 统计卡片 -->
        <div class="stats">
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #4361ee, #3a0ca3);"><i class="bi bi-people"></i></div>
                <div><div class="stat-val" id="empCount">-</div><div class="stat-label">员工总数</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #f72585, #b5179e);"><i class="bi bi-diagram-3"></i></div>
                <div><div class="stat-val" id="deptCount">-</div><div class="stat-label">部门数量</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #4cc9f0, #4895ef);"><i class="bi bi-currency-dollar"></i></div>
                <div><div class="stat-val" id="avgSalary">-</div><div class="stat-label">平均薪资</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon" style="background: linear-gradient(135deg, #06d6a0, #1b9aaa);"><i class="bi bi-cpu"></i></div>
                <div><div class="stat-val" id="hiveStatus">-</div><div class="stat-label">大数据引擎</div></div>
            </div>
        </div>
        <!-- 图表 -->
        <div class="charts-row">
            <div class="chart-box"><h5>📈 性别分布</h5><div class="chart-inner" id="chartGender"></div></div>
            <div class="chart-box"><h5>💰 薪资区间</h5><div class="chart-inner" id="chartSalary"></div></div>
            <div class="chart-box"><h5>🏢 部门人数统计</h5><div class="chart-inner" id="chartDept"></div></div>
            <div class="chart-box"><h5>📋 最近操作</h5><div id="recentLogs" style="max-height:300px; overflow-y:auto;"></div></div>
        </div>
    </div>
    <script src="/vendor/jquery.min.js"></script>
    <script>
        const API = '/api';
        function logout() { $.post('/api/logout', () => location.href = '/login'); }

        // 加载用户信息
        $.get(API + '/admin/current', r => { if(r.code===200) $('#userName').text('欢迎，'+r.data.username); else location.href='/login'; });

        // 加载统计数据
        function loadStats() {
            $.get(API + '/employee/page?page=1&size=9999', r => {
                if(r.code===200) {
                    let emps = r.data.records;
                    $('#empCount').text(emps.length);
                    let totalSalary = emps.reduce((s, e) => s + (e.salary||0), 0);
                    $('#avgSalary').text(emps.length > 0 ? '¥' + (totalSalary / emps.length).toFixed(0) : '¥0');
                }
            });
            $.get(API + '/department', r => { if(r.code===200) $('#deptCount').text(r.data.length); });
            $.get(API + '/bigdata/status', r => { if(r.code===200) $('#hiveStatus').text(r.data.message.includes('正常')?'运行中':'待启动'); });
        }
        loadStats();

        // 图表
        function initChart(id, option) { let c = echarts.init(document.getElementById(id)); c.setOption(option); window.addEventListener('resize', ()=>c.resize()); }

        $.get(API + '/analysis/employee/portrait', r => {
            if(r.code !== 200) return;
            let d = r.data;
            initChart('chartGender', {
                tooltip: { trigger: 'item' },
                series: [{ type: 'pie', radius: ['45%','70%'], data: d.genderDistribution, label: { show: true } }]
            });
            initChart('chartSalary', {
                tooltip: { trigger: 'item' },
                xAxis: { type: 'category', data: d.salaryDistribution.map(i=>i.name) },
                yAxis: { type: 'value' },
                series: [{ type: 'bar', data: d.salaryDistribution.map(i=>i.value),
                    itemStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[
                        {offset:0,color:'#4361ee'},{offset:1,color:'#3a0ca3'}
                    ])}, barWidth: '50%' }]
            });
            initChart('chartDept', {
                tooltip: { trigger: 'axis' },
                xAxis: { type: 'category', data: d.deptDistribution.map(i=>'部门'+i.deptId), axisLabel:{rotate:30} },
                yAxis: { type: 'value' },
                series: [{ type: 'bar', data: d.deptDistribution.map(i=>i.count),
                    itemStyle: { color: '#4cc9f0' }, barWidth: '60%' }]
            });
        });

        // 最近操作
        $.get(API + '/analysis/operation/trend', r => {
            if(r.code===200) {
                let html = '<table class="table table-sm"><thead><tr><th>日期</th><th>操作量</th></tr></thead><tbody>';
                r.data.slice(-10).reverse().forEach(d => html += `<tr><td>${d.date}</td><td>${d.count}</td></tr>`);
                html += '</tbody></table>';
                $('#recentLogs').html(html);
            }
        });
    </script>
</body>
</html>
